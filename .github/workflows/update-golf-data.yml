name: Update Golf Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    paths:
      - "scripts/update_courses.js"
      - "scripts/enrich_courses.js"
      - ".github/workflows/update-golf-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update base golf course data
        run: node scripts/update_courses.js

      - name: Enrich from official golf course homepages
        run: node scripts/enrich_courses.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/courses.json
          git diff --cached --quiet || git commit -m "chore: update golf course official homepage data"
          git push
